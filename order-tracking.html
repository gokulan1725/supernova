<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track your ShopNova order delivery status in real-time. Enter your order tracking number to see current progress.">
  <title>Track Order — ShopNova</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .tracking-page {
      padding: var(--space-8) 0 var(--space-16);
      min-height: calc(100vh - 450px);
    }

    .tracking-layout {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Tracker Search Box */
    .tracker-search-box {
      background: var(--bg-700);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: var(--space-6) var(--space-8);
      margin-bottom: var(--space-8);
      box-shadow: var(--shadow-md);
      display: flex;
      gap: var(--space-4);
      align-items: center;
      flex-wrap: wrap;
    }

    .tracker-search-title {
      flex: 1 1 200px;
    }

    .tracker-search-title h3 {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 700;
      margin-bottom: 2px;
    }

    .tracker-search-title p {
      font-size: var(--text-xs);
      color: var(--text-muted);
    }

    .tracker-search-form {
      display: flex;
      flex: 2 1 400px;
      gap: var(--space-2);
    }

    .tracker-search-input {
      flex: 1;
      padding: var(--space-3) var(--space-4);
      background: var(--bg-600);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: var(--text-sm);
    }

    .tracker-search-input:focus {
      outline: none;
      border-color: var(--brand-primary);
      box-shadow: 0 0 10px rgba(108, 99, 255, 0.2);
    }

    /* Main Tracking Card */
    .tracking-card {
      background: var(--bg-700);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      box-shadow: var(--shadow-lg);
      margin-bottom: var(--space-8);
      position: relative;
      overflow: hidden;
    }

    .tracking-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--grad-primary);
    }

    .tracking-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: var(--space-4);
      padding-bottom: var(--space-6);
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: var(--space-8);
    }

    .summary-item-label {
      font-size: var(--text-xs);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .summary-item-val {
      font-weight: 700;
      font-size: var(--text-base);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-processing { background: rgba(108, 99, 255, 0.15); color: var(--brand-primary); border: 1px solid rgba(108, 99, 255, 0.3); }
    .status-shipped { background: rgba(255, 107, 53, 0.15); color: var(--brand-orange); border: 1px solid rgba(255, 107, 53, 0.3); }
    .status-delivered { background: rgba(67, 233, 123, 0.15); color: var(--brand-accent); border: 1px solid rgba(67, 233, 123, 0.3); }

    /* Stepper Timeline */
    .timeline-stepper {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin-bottom: var(--space-8);
      padding: var(--space-4) 0;
    }

    .timeline-progress-bar {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      height: 4px;
      background: var(--bg-500);
      width: 100%;
      z-index: 1;
    }

    .timeline-progress-fill {
      height: 100%;
      background: var(--grad-primary);
      width: 0%;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 15px rgba(108, 99, 255, 0.5);
    }

    .timeline-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
      flex: 1;
    }

    .step-node {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-full);
      background: var(--bg-500);
      border: 3px solid var(--bg-700);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--text-muted);
      transition: all var(--transition-base);
    }

    .step-label {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-muted);
      margin-top: var(--space-2);
      text-align: center;
      transition: all var(--transition-base);
    }

    .step-time {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Active & Completed States */
    .timeline-step.completed .step-node {
      background: var(--brand-primary);
      color: white;
      box-shadow: 0 0 15px rgba(108, 99, 255, 0.4);
    }

    .timeline-step.completed .step-label {
      color: var(--text-primary);
    }

    .timeline-step.active .step-node {
      background: var(--bg-700);
      border-color: var(--brand-primary);
      color: var(--brand-primary);
      box-shadow: 0 0 20px rgba(108, 99, 255, 0.6);
      transform: scale(1.1);
      animation: pulse-glow 2s infinite;
    }

    .timeline-step.active .step-label {
      color: var(--brand-primary);
      font-weight: 700;
    }

    @keyframes pulse-glow {
      0% { box-shadow: 0 0 0 0 rgba(108, 99, 255, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(108, 99, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(108, 99, 255, 0); }
    }

    /* Order Info Details */
    .tracking-details {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: var(--space-6);
      align-items: start;
    }

    .tracking-items-panel,
    .tracking-shipping-panel {
      background: var(--bg-600);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
    }

    .tracking-items-panel h4,
    .tracking-shipping-panel h4 {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 700;
      margin-bottom: var(--space-4);
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: var(--space-2);
    }

    .tracking-item-row {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--glass-border);
    }

    .tracking-item-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .tracking-item-img {
      width: 50px;
      height: 50px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: var(--bg-500);
    }

    .tracking-item-info {
      flex: 1;
    }

    .tracking-item-name {
      font-size: var(--text-sm);
      font-weight: 500;
      line-height: 1.2;
    }

    .tracking-item-qty {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-top: 2px;
    }

    .tracking-item-price {
      font-size: var(--text-sm);
      font-weight: 700;
    }

    .shipping-info-row {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .shipping-info-item {
      display: flex;
      flex-direction: column;
    }

    .shipping-info-label {
      font-size: var(--text-xs);
      color: var(--text-muted);
    }

    .shipping-info-val {
      font-size: var(--text-sm);
      font-weight: 500;
      margin-top: 2px;
    }

    /* Simulator Panel */
    .simulator-panel {
      margin-top: var(--space-6);
      padding: var(--space-4);
      border: 1px dashed var(--brand-primary);
      background: rgba(108, 99, 255, 0.05);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-4);
    }

    .simulator-title {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--brand-primary);
    }

    .simulator-actions {
      display: flex;
      gap: var(--space-2);
    }

    @media (max-width: 768px) {
      .timeline-stepper {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-4);
        padding-left: var(--space-6);
      }
      .timeline-progress-bar {
        left: 20px;
        top: 0;
        width: 4px;
        height: 100%;
        transform: none;
      }
      .timeline-step {
        flex-direction: row;
        gap: var(--space-4);
        align-items: center;
        text-align: left;
      }
      .step-label {
        margin-top: 0;
        text-align: left;
      }
      .tracking-details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="tracking-page">
    <div class="container">
      
      <!-- Breadcrumb -->
      <nav class="breadcrumb mb-6" aria-label="Breadcrumb">
        <span class="breadcrumb-item"><a href="index.html">Home</a></span>
        <span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-item active">Track Order</span>
      </nav>

      <div class="tracking-layout">

        <!-- Search Order Box -->
        <div class="tracker-search-box">
          <div class="tracker-search-title">
            <h3>Track another order</h3>
            <p class="mb-0">Enter your ShopNova Order ID to track its real-time shipping status.</p>
          </div>
          <form class="tracker-search-form" onsubmit="handleSearch(event)">
            <input type="text" class="tracker-search-input" id="order-search-input" placeholder="e.g. SN-2024-001" required>
            <button type="submit" class="btn btn-primary">Track</button>
          </form>
        </div>

        <!-- Tracking Card -->
        <div id="tracking-content">
          <!-- Dynamically populated or error message shown -->
        </div>

      </div>

    </div>
  </main>

  <div id="footer-container"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/features.js"></script>
  <script>
    document.getElementById('navbar-container').innerHTML = buildNavbar();
    document.getElementById('footer-container').innerHTML = buildFooter();

    // Helper: persist orders to localStorage if not exists, so simulate works across views
    const STORAGE_KEY = 'shopnova_orders';
    function loadOrders() {
      let saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(SHOPNOVA_DATA.demoOrders));
        return SHOPNOVA_DATA.demoOrders;
      }
      return JSON.parse(saved);
    }

    function saveOrders(orders) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
    }

    // Get order ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    let orderId = urlParams.get('id');

    // Default to the first order if none provided
    const orders = loadOrders();
    if (!orderId && orders.length > 0) {
      orderId = orders[0].id;
    }

    function handleSearch(e) {
      e.preventDefault();
      const id = document.getElementById('order-search-input').value.trim();
      if (id) {
        window.location.href = `order-tracking.html?id=${id}`;
      }
    }

    async function updateOrderState(id, newStatus) {
      if (isBackendMode) {
        try {
          const res = await apiRequest('PUT', `/orders/${id}`, { status: newStatus });
          if (res.success) {
            Notify.success('Status updated on backend!', `Order is now: ${newStatus.toUpperCase()}`);
            await renderTracking(id);
            return;
          }
        } catch (e) {
          console.warn('Backend order update failed, falling back to local');
        }
      }

      const ordersList = loadOrders();
      const order = ordersList.find(o => o.id === id);
      if (order) {
        order.status = newStatus;
        saveOrders(ordersList);
        // Refresh page view
        await renderTracking(id);
        Notify.success('Status updated!', `Order is now: ${newStatus.toUpperCase()}`);
      }
    }

    async function renderTracking(id) {
      const container = document.getElementById('tracking-content');
      let order = null;
      let timeline = null;
      let estimatedDelivery = '2-3 Business Days';

      // If backend mode, fetch live data
      if (isBackendMode) {
        try {
          const ordRes = await apiRequest('GET', `/orders/${id}`);
          if (ordRes.success && ordRes.data) {
            order = ordRes.data;
          }
          const trackRes = await apiRequest('GET', `/shipping/track/${id}`);
          if (trackRes.success && trackRes.data) {
            timeline = trackRes.data.timeline;
            estimatedDelivery = trackRes.data.estimatedDelivery;
          }
        } catch (e) {
          console.warn('Failed to load tracking details from backend API, using local fallback:', e);
        }
      }

      // Local fallback
      if (!order) {
        const ordersList = loadOrders();
        order = ordersList.find(o => o.id === id);
      }

      if (!order) {
        container.innerHTML = `
          <div class="empty-state" style="padding: var(--space-12) var(--space-6); text-align: center; background: var(--bg-700); border: 1px solid var(--glass-border); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);">
            <div class="empty-icon" style="font-size: 4rem; margin-bottom: var(--space-4);">📦</div>
            <h3 class="text-2xl font-bold mb-2">Order Not Found</h3>
            <p class="text-secondary mb-6">We couldn't find an order with the ID <strong>${id}</strong>. Make sure it is correct or enter another one.</p>
            <a href="profile.html" class="btn btn-secondary">View My Orders</a>
          </div>
        `;
        return;
      }

      // Steps configuration
      let steps = [];
      let statusIndex = 0;
      let progressPercent = 0;

      if (timeline) {
        steps = timeline.map(t => ({
          key: t.status,
          label: t.label,
          icon: t.icon,
          date: t.time ? t.time.split('T')[0] : ''
        }));
        
        const activeIdx = timeline.findIndex(t => t.current);
        statusIndex = activeIdx !== -1 ? activeIdx : timeline.findIndex(t => t.status === order.status);
        if (statusIndex === -1) statusIndex = 0;
        progressPercent = (statusIndex / (steps.length - 1)) * 100;
      } else {
        steps = [
          { key: 'placed', label: 'Order Placed', icon: '📝', date: order.date },
          { key: 'processing', label: 'Processing', icon: '⚙️', date: order.status !== 'placed' ? order.date : '' },
          { key: 'shipped', label: 'Shipped', icon: '🚚', date: (order.status === 'shipped' || order.status === 'delivered') ? order.date : '' },
          { key: 'delivered', label: 'Delivered', icon: '🎁', date: order.status === 'delivered' ? order.date : '' }
        ];

        if (order.status === 'processing') statusIndex = 1;
        if (order.status === 'shipped') statusIndex = 2;
        if (order.status === 'delivered') statusIndex = 3;
        progressPercent = (statusIndex / (steps.length - 1)) * 100;
      }

      // Build product items html
      const itemsHtml = order.items.map(item => {
        const product = getProduct(item.productId) || { name: `Product ID: ${item.productId}`, image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=100&h=100&fit=crop', price: item.price };
        return `
          <div class="tracking-item-row">
            <img class="tracking-item-img" src="${product.image}" alt="${product.name}">
            <div class="tracking-item-info">
              <div class="tracking-item-name">${product.name}</div>
              <div class="tracking-item-qty">Qty: ${item.qty}</div>
            </div>
            <div class="tracking-item-price">${formatPrice(item.price * item.qty)}</div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="tracking-card">
          <!-- Summary info -->
          <div class="tracking-summary">
            <div>
              <div class="summary-item-label">Order ID</div>
              <div class="summary-item-val" style="color: var(--brand-primary);">${order.id}</div>
            </div>
            <div>
              <div class="summary-item-label">Date Placed</div>
              <div class="summary-item-val">${order.date}</div>
            </div>
            <div>
              <div class="summary-item-label">Status</div>
              <div>
                <span class="status-badge status-${order.status}">${order.status}</span>
              </div>
            </div>
            <div>
              <div class="summary-item-label">Est. Delivery</div>
              <div class="summary-item-val">${order.status === 'delivered' ? 'Delivered' : estimatedDelivery}</div>
            </div>
          </div>

          <!-- Stepper timeline -->
          <div class="timeline-stepper">
            <div class="timeline-progress-bar">
              <div class="timeline-progress-fill" style="width: ${progressPercent}%;">
                <div class="truck-icon-animated" style="position:absolute; right:-16px; top:-12px; font-size:20px; animation:bounce 1.5s infinite ease-in-out">🚚</div>
              </div>
            </div>
            ${steps.map((step, idx) => {
              let stateClass = '';
              if (idx < statusIndex) stateClass = 'completed';
              else if (idx === statusIndex) stateClass = 'active';

              return `
                <div class="timeline-step ${stateClass}">
                  <div class="step-node">${step.icon}</div>
                  <div class="step-label">${step.label}</div>
                  ${step.date ? `<div class="step-time">${step.date}</div>` : ''}
                </div>
              `;
            }).join('')}
          </div>

          <!-- Shipping Details & Products Details -->
          <div class="tracking-details">
            <div class="tracking-items-panel">
              <h4>Order Items</h4>
              <div class="tracking-items-list">
                ${itemsHtml}
              </div>
              <div style="margin-top: var(--space-4); text-align: right; font-weight: 700; font-size: var(--text-base); border-top: 1px solid var(--glass-border); padding-top: var(--space-3)">
                Total: ${formatPrice(order.total)}
              </div>
            </div>

            <div class="tracking-shipping-panel">
              <h4>Delivery Information</h4>
              <div class="shipping-info-row">
                <div class="shipping-info-item">
                  <div class="shipping-info-label">Shipping Address</div>
                  <div class="shipping-info-val">${order.address || 'No address specified'}</div>
                </div>
                <div class="shipping-info-item">
                  <div class="shipping-info-label">Carrier</div>
                  <div class="shipping-info-val">ShopNova Express</div>
                </div>
                <div class="shipping-info-item">
                  <div class="shipping-info-label">Tracking Number</div>
                  <div class="shipping-info-val">${order.id.replace('SN', 'TRA')}</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Simulation Panel -->
        <div class="simulator-panel animate-fadeIn">
          <div class="simulator-title">🧪 Order Simulator (Demonstration Only)</div>
          <div class="simulator-actions">
            <button class="btn btn-ghost btn-sm" onclick="updateOrderState('${order.id}', 'placed')">Placed</button>
            <button class="btn btn-ghost btn-sm" onclick="updateOrderState('${order.id}', 'processing')">Processing</button>
            <button class="btn btn-ghost btn-sm" onclick="updateOrderState('${order.id}', 'shipped')">Shipped</button>
            <button class="btn btn-ghost btn-sm" onclick="updateOrderState('${order.id}', 'delivered')">Delivered</button>
          </div>
        </div>
      `;
      
      initScrollReveal();
    }

    // Initial load
    renderTracking(orderId);
    initApp();
  </script>
</body>
</html>
