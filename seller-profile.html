<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Seller Profile on ShopNova. View seller ratings, reviews, verified badges, and all products listed by this seller.">
  <title>Seller Profile — ShopNova</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6C63FF">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .seller-page { padding: var(--space-8) 0 var(--space-16); }

    .seller-header-card {
      background: var(--bg-700);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-2xl);
      padding: var(--space-8);
      margin-bottom: var(--space-8);
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }

    .seller-header-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: var(--grad-primary);
    }

    .seller-profile-grid {
      display: grid;
      grid-template-columns: 100px 1fr auto;
      gap: var(--space-6);
      align-items: center;
    }

    .seller-avatar-big {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--grad-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 800;
      color: white;
      border: 4px solid var(--bg-600);
      box-shadow: var(--shadow-brand);
    }

    .seller-title-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .seller-name {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 800;
    }

    .seller-verified-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      background: rgba(67, 233, 123, 0.15);
      border: 1px solid rgba(67, 233, 123, 0.3);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
      color: var(--brand-accent);
    }

    .seller-meta-row {
      display: flex;
      gap: var(--space-6);
      color: var(--text-muted);
      font-size: var(--text-sm);
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .seller-meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .seller-meta-item strong { color: var(--text-primary); }

    .seller-action-btns {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      min-width: 160px;
    }

    .seller-stats-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-4);
      margin-top: var(--space-6);
      padding-top: var(--space-6);
      border-top: 1px solid var(--glass-border);
    }

    .seller-stat-box {
      text-align: center;
      background: var(--bg-600);
      padding: var(--space-4);
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-border);
    }

    .seller-stat-val {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--brand-primary);
    }

    .seller-stat-lbl {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    @media (max-width: 900px) {
      .seller-profile-grid { grid-template-columns: 1fr; text-align: center; justify-items: center; }
      .seller-meta-row { justify-content: center; }
      .seller-action-btns { width: 100%; flex-direction: row; }
      .seller-stats-strip { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="seller-page">
    <div class="container">

      <!-- Breadcrumb -->
      <nav class="breadcrumb mb-6" aria-label="Breadcrumb">
        <span class="breadcrumb-item"><a href="index.html">Home</a></span>
        <span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-item"><a href="products.html">Sellers</a></span>
        <span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-item active" id="bc-seller-name">Seller Profile</span>
      </nav>

      <!-- Seller Header Card -->
      <div id="seller-header-container">
        <div class="empty-state"><div class="spinner"></div></div>
      </div>

      <!-- Seller Products Grid -->
      <div class="section-header mb-6">
        <div>
          <div class="section-badge purple">🛍️ Catalog</div>
          <h2 class="section-title">Products by this Seller</h2>
          <p class="section-subtitle" id="seller-products-count">Browse items directly fulfilled by this store</p>
        </div>
      </div>

      <div class="products-grid" id="seller-products-grid">
        <div class="empty-state"><div class="spinner"></div></div>
      </div>

    </div>
  </main>

  <div id="footer-container"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/chat-widget.js"></script>
  <script>
    document.getElementById('navbar-container').innerHTML = buildNavbar();
    document.getElementById('footer-container').innerHTML = buildFooter();

    const urlParams = new URLSearchParams(window.location.search);
    const sellerId  = urlParams.get('id') || 's1';

    // Simulated Seller Data
    const DEMO_SELLERS = {
      's1': {
        id: 's1',
        name: 'ApexTech Electronics',
        badge: 'Top Rated Seller',
        verified: true,
        rating: 4.9,
        reviewCount: 4820,
        positiveFeedback: '98.6%',
        joinDate: 'Jan 2022',
        salesCount: 38400,
        responseTime: '< 1 hour',
        shipSpeed: '1-2 Days',
        location: 'San Jose, CA',
        bio: 'Authorized retailer for Sony, Apple, Samsung, and Dell electronics. 100% genuine products with manufacturer warranty.',
        categories: ['electronics', 'toys']
      },
      's2': {
        id: 's2',
        name: 'Luxe Style & Co.',
        badge: 'Fashion Partner',
        verified: true,
        rating: 4.8,
        reviewCount: 2910,
        positiveFeedback: '97.4%',
        joinDate: 'Mar 2021',
        salesCount: 22100,
        responseTime: '< 2 hours',
        shipSpeed: '2-3 Days',
        location: 'New York, NY',
        bio: 'Curated premium fashion, designer apparel, footwear, and luxury accessories. Worldwide express shipping.',
        categories: ['fashion', 'beauty', 'jewelry']
      }
    };

    const seller = DEMO_SELLERS[sellerId] || DEMO_SELLERS['s1'];
    document.title = `${seller.name} — ShopNova Seller`;
    document.getElementById('bc-seller-name').textContent = seller.name;

    // Render Seller Header
    document.getElementById('seller-header-container').innerHTML = `
      <div class="seller-header-card reveal">
        <div class="seller-profile-grid">
          <div class="seller-avatar-big">${seller.name.charAt(0)}</div>
          <div>
            <div class="seller-title-row">
              <h1 class="seller-name">${seller.name}</h1>
              ${seller.verified ? `<span class="seller-verified-tag">✓ Verified Store</span>` : ''}
              <span class="badge badge-primary">${seller.badge}</span>
            </div>
            <p style="color:var(--text-secondary);font-size:14px;line-height:1.6;margin-top:4px">${seller.bio}</p>
            <div class="seller-meta-row">
              <div class="seller-meta-item">⭐ <strong>${seller.rating}</strong> (${seller.reviewCount.toLocaleString()} reviews)</div>
              <div class="seller-meta-item">👍 <strong>${seller.positiveFeedback}</strong> positive feedback</div>
              <div class="seller-meta-item">📍 ${seller.location}</div>
              <div class="seller-meta-item">📅 Member since <strong>${seller.joinDate}</strong></div>
            </div>
          </div>
          <div class="seller-action-btns">
            <button class="btn btn-primary" onclick="ChatWidget.toggleChat(); ChatWidget.quickSend('I have a question for ${seller.name}')">💬 Message Store</button>
            <button class="btn btn-secondary" onclick="shareSeller()">📤 Share Store</button>
          </div>
        </div>

        <div class="seller-stats-strip">
          <div class="seller-stat-box">
            <div class="seller-stat-val">${seller.salesCount.toLocaleString()}</div>
            <div class="seller-stat-lbl">Items Sold</div>
          </div>
          <div class="seller-stat-box">
            <div class="seller-stat-val" style="color:var(--brand-accent)">${seller.shipSpeed}</div>
            <div class="seller-stat-lbl">Avg. Shipping Time</div>
          </div>
          <div class="seller-stat-box">
            <div class="seller-stat-val" style="color:var(--brand-gold)">${seller.responseTime}</div>
            <div class="seller-stat-lbl">Response Time</div>
          </div>
          <div class="seller-stat-box">
            <div class="seller-stat-val" style="color:var(--brand-secondary)">99.2%</div>
            <div class="seller-stat-lbl">Order Accuracy</div>
          </div>
        </div>
      </div>
    `;

    // Render Seller Products
    async function loadSellerProducts() {
      let products = [];
      if (typeof apiRequest !== 'undefined') {
        const res = await apiRequest('GET', '/products');
        if (res.success && res.data) products = res.data;
      }
      if (products.length === 0) products = SHOPNOVA_DATA.products;

      // Filter products matching seller categories
      const sellerProducts = products.filter(p => seller.categories.includes(p.category));
      document.getElementById('seller-products-count').textContent = `Showing ${sellerProducts.length} verified products from ${seller.name}`;

      const grid = document.getElementById('seller-products-grid');
      grid.innerHTML = sellerProducts.map(p => buildProductCard(p)).join('');
      initScrollReveal();
    }

    function shareSeller() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        Notify.success('Link copied!', 'Seller profile link copied to clipboard');
      });
    }

    loadSellerProducts();
    initApp();
  </script>
</body>
</html>
